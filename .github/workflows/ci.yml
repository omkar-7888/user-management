
name: User Management CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify runner
        run: echo "GitHub Actions runner is working"

  frontend-build:
    name: Frontend - Test and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build

  backend-build:
    name: Backend - Test and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: user_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d user_management_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/user_management_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/user_management_test
      CORS_ORIGIN: http://localhost:5173
      PORT: 5001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Verify Node.js version
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run backend tests
        run: npm run test:run

      - name: Build backend
        run: npm run build

  docker-frontend:
    name: Docker - Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: docker build -t user-management-frontend:ci ./frontend

      - name: Scan frontend Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: user-management-frontend:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

  docker-backend:
    name: Docker - Backend Build
    runs-on: ubuntu-latest
    needs: [backend-build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t user-management-backend:ci ./backend
      
      - name: Scan backend Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: user-management-backend:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'